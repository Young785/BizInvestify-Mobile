name: bizinvestify_mobile
description: "BizInvestify Mobile App - Beautiful task management and business platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  
  # Navigation & State
  go_router: ^14.2.7
  flutter_riverpod: ^2.5.1
  
  # Network & API
  http: ^1.2.2
  dio: ^5.7.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  
  # Storage & Security
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  
  # Utils & Helpers
  intl: ^0.20.2
  uuid: ^4.5.1
  
  # QR Code generation for 2FA
  qr_flutter: ^4.1.0
  
  # Biometric Authentication
  local_auth: ^2.3.0
  local_auth_android: ^1.0.41
  local_auth_darwin: ^1.4.1
  
  # Payment Integration
  flutter_stripe: ^11.1.0
  
  # File & Media
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  
  # Animations
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  
  # Firebase & Analytics (updated for Flutter 3.32 / Dart 3.8 web interop)
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0
  firebase_performance: ^0.11.0
  # Google services Gradle plugin is applied in Android build scripts
  # Ensure google-services.json and GoogleService-Info.plist are added for Firebase

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.13
  freezed: ^2.5.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
